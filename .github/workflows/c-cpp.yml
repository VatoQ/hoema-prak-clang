name: C CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential

    - name: Build
      run: make

    - name: Run tests
      run: make tests

    - name: Run benchmarks + optimization report
      run: make benchmarks

    - name: Show optimization report
      run: cat opt_report.txt

