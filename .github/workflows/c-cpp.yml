name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgomp1

    - name: Build project
      run: make clean && make

    - name: Build tests
      run: make tests

    - name: Run tests
      run: |
        for test in bin/test_*; do
          echo "Running $test..."
          "$test"
          if [ $? -ne 0 ]; then
            echo "Test $test failed!"
            exit 1
          fi
        done
